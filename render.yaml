services:
  - type: web
    name: amron-api
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask db upgrade
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_APP
        value: run.py
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        sync: false
      - key: JWT_EXPIRY_DAYS
        value: "7"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: uploads
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

  # Sends the daily WhatsApp reports. Runs every 15 minutes; the app itself
  # decides what's due (each report's own send time, once per day), so
  # changing a time in the Reports screen needs no redeploy. NOTE: Render
  # cron jobs are billed separately from the web service, and every
  # `sync: false` variable below must be filled in on this service too
  # (easiest: put the shared ones in a Render Environment Group).
  - type: cron
    name: amron-daily-reports
    env: python
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: flask send-daily-reports
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_APP
        value: run.py
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        sync: false
      - key: JWT_EXPIRY_DAYS
        value: "7"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: uploads
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: REPORT_TZ
        value: Asia/Kolkata
